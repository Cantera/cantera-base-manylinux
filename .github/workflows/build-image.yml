name: Build Image from Dockerfile
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
      - "CMakeLists.txt"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
      - "CMakeLists.txt"
  workflow_dispatch:
    inputs:
      manylinux_tag:
        description: "Manylinux tag to build"
        required: true
        default: "2026.02.01-1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build image for ${{ matrix.arch }}
    runs-on: ubuntu-24.04${{ matrix.arch == 'aarch64' && '-arm' || '' }}
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            plat: linux/amd64
          - arch: aarch64
            plat: linux/arm64
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/cantera/cantera-base-manylinux_2_28-${{ matrix.arch }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
      - name: Build args
        id: build-args
        run: |
          {
            echo 'BUILD_ARGS<<EOF'
            echo TARGET_ARCH=${{ matrix.arch }}
            if [ -n "$MANYLINUX_TAG_INPUT" ]; then
              echo MANYLINUX_TAG=$MANYLINUX_TAG_INPUT
            fi
            echo EOF
          } >> $GITHUB_OUTPUT
        env:
          MANYLINUX_TAG_INPUT: ${{ github.event.inputs.manylinux_tag }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.plat }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.BUILD_ARGS }}
          cache-from: ${{ github.event_name != 'pull_request' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
